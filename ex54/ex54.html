<html>
    <head> 
        <meta charset="UTF-8">
        <title> Tiêu đề trang </title>
        <script>
            function max() {
                var a = parseFloat(myform.a.value);
                var b = parseFloat(myform.b.value);
                var c = parseFloat(myform.c.value);
                myform.result.value = Math.max(a, b, c);
            }
            function min() {
                var a = parseFloat(myform.a.value);
                var b = parseFloat(myform.b.value);
                var c = parseFloat(myform.c.value);
                myform.result.value = Math.min(a, b, c);
            }
            function sin() {
                var a = parseFloat(myform.a.value);
                myform.result.value = Math.sin(a);
            }
            function cos() {
                var a = parseFloat(myform.a.value);
                myform.result.value = Math.cos(a);
            }
            function amub() {
                var a = parseFloat(myform.a.value);
                var b = parseFloat(myform.b.value);
                myform.result.value = Math.pow(a, b);
            }
        </script>
    </head>
    <body>
        <form name="myform">
        <table border ="1">
            <tr>
                <td>a:</td>
                <td> <input type="text" name="a" value=""></td>
            </tr>
            <tr>
                <td>b:</td>
                <td> <input type="text" name="b" value=""></td>
            </tr>
            <tr>
                <td>c:</td>
                <td> <input type="text" name="c" value=""></td>
            </tr>
            <tr>
                <td>Result:</td>
                <td> <input type="text" name="result" value="" readonly></td>
            </tr>
            <tr>
                <td colspan="2">
                    <button type="button" onclick="max()">Max</button>
                    <button type="button" onclick="min()">Min</button>
                    <button type="button" onclick="sin()">Sin</button>
                    <button type="button" onclick="cos()">Cos</button>
                    <button type="button" onclick="amub()">a^b</button>
                </td>
            </tr>
            </table>
        </form>
    </body>
</html>
