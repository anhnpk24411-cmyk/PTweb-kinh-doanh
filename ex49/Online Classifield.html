<html>
<head>
    <meta charset="utf-8" />
    <title>Online Classified</title>
    <style type="text/css">
        button
        {
        width: 100px;
        height: 100px;
        background-color: transparent;
        background-repeat: no-repeat;
        background-size: contain;
        border-style: none;
        }
    </style>
</head>
<body style="background-color:rgb(186, 226, 234); padding:20px;">
    <form>
            <h1 style = "color:red">Online Classifieds Search Form</h1>
        <hr />
            <ol>
                <li>
                    Search for classified in the following sections:
                    <table>
                        <tr>
                            <td>
                                <input type="radio"
                                       name="type"
                                       id="radio_1"
                                       value="employment" />
                                <label for="radio_1">Employment</label>
                            </td>
                            <td>
                                <input type="radio"
                                       name="type"
                                       id="radio_2"
                                       value="personal" />
                                <label for="radio_2">Personal</label>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <input type="radio"
                                       name="type"
                                       id="radio_3"
                                       value="sale" />
                                <label for="radio_3">For Sale</label>
                            </td>
                            <td>
                                <input type="radio"
                                       name="type"
                                       id="radio_4"
                                       value="miscellaneous" />
                                <label for="radio_4">Miscellaneous</label>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <input type="radio"
                                       name="type"
                                       id="radio_5"
                                       value="housing" />
                                <label for="radio_5">Housing</label>
                            </td>
                            <td>
                                <input type="radio" name="type" id="radio_6" value="all" />
                                <label for="radio_6">All of the above</label>
                            </td>
                        </tr>
                    </table>
                </li>
                <li>
                    Search the following publications:
                    <table>
                        <tr>
                            <td>
                                <input type="checkbox"
                                       name="checkbox_1"
                                       id="checkbox_1" />
                                <label for="checkbox_1">Midwest times</label>
                            </td>
                            <td>
                                <input type="checkbox" name="checkbox_2" id="checkbox_2" />
                                <label for="checkbox_2">Modern News</label>
                            </td>
                            <td>
                                <input type="checkbox" name="checkbox_3" id="checkbox_3" />
                                <label for="checkbox_3">Employment Today</label>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <input type="checkbox"
                                       name="checkbox_4"
                                       id="checkbox_4" />
                                <label for="checkbox_4">Great Lakes Classifieds</label>
                            </td>
                            <td>
                                <input type="checkbox" name="checkbox_5" id="checkbox_5" />
                                <label for="checkbox_5">Middleton Daily</label>
                            </td>
                            <td>
                                <input type="checkbox" name="checkbox_6" id="checkbox_6" />
                                <label for="checkbox_6">Cashtown Daily News</label>
                            </td>
                        </tr>
                    </table>
                </li>
                <li>
                    From
                    <input type="date" name="startdate">
                    to
                    <input type="date" name="enddate">
                </li>
                <li>
                    Enter a keyword to describe the classified
                    <br />
                    <input type="text" name="keywords" style="width:300px">
                </li>
                <li>
                    Click one of the option below:
                    <br />
                    <button style="background-image: url('images/Search.gif');" type="button" title="Search" onclick="Search()"></button>
                    <button style="background-image: url('images/Help.gif');" type="button" title="Help" onclick="Help()"></button>
                    <button style="background-image: url('images/Cancel.gif');" type="button" title="Cancel" onclick="Clear()"></button>
                </li>
            </ol>
    </form>
</body>
</html>
