<html>
    <head> 
        <meta charset="UTF-8">
        <title> Tiêu đề trang </title>
        <script>
            function SUM() {
                var quantity1 = parseFloat(myform.quantity1.value);
                var quantity2 = parseFloat(myform.quantity2.value);
                var quantity3 = parseFloat(myform.quantity3.value);
                var p1 = parseFloat(document.getElementById('price1').innerText);
                var p2 = parseFloat(document.getElementById('price2').innerText);
                var p3 = parseFloat(document.getElementById('price3').innerText);
                var v1 = quantity1 * p1;
                var v2 = quantity2 * p2;
                var v3 = quantity3 * p3;
                myform.item1.value = v1.toFixed(2) + "$";
                myform.item2.value = v2.toFixed(2) + "$";
                myform.item3.value = v3.toFixed(2) + "$";
                var total = v1 + v2 + v3;
                myform.total.value = total.toFixed(2) + "$";
            }
        </script>
    </head>
    <body>
        <form name ="myform">
            <table style="border: 1px solid black;">
                <thead>
                    <tr>
                        <td>Part Number</td>
                        <td>Description</td>
                        <td>Price</td>
                        <td>Quantity</td>
                        <td>Item Table</td>
                    </tr>
                </thead>
                <tr>
                    <td> C112</td>
                    <td> Mouse</td>
                    <td id="price1"> 19.95$</td>
                    <td> <input type="number" name="quantity1" min="1" value="0"></td>
                    <td> <input type="text" name="item1" value="" readonly></td>
                </tr>
                <tr>
                    <td> B124</td>
                    <td> Keyboard US</td>
                    <td id="price2"> 29.95$</td>
                    <td> <input type="number" name="quantity2" min="1" value="0"></td>
                    <td> <input type="text" name="item2" value="" readonly></td>
                </tr>
                <tr>
                    <td> U125</td>
                    <td> USB KingMax</td>
                    <td id="price3"> 39.95$</td>
                    <td> <input type="number" name="quantity3" min="1" value="0"></td>
                    <td> <input type="text" name="item3" value="" readonly></td>
                </tr>
                <tr>
                    <td colspan="5"><hr></td>
                </tr>
                <tr>
                    <td colspan="4" align="right">Total</td>
                    <td><input type="text" name="total" readonly></td>
                </tr>
                <tr>
                    <td colspan="5" align="right">
                        <button type="button" onclick="SUM()">Sum</button>
                    </td>
                </tr>
            </table>
        </form>
    </body>
</html>
