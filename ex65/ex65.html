<html>
<head>
    <meta charset="UTF-8">
    <title>Design Web Node</title>
    <style type="text/css">
        @import url("css/maincss.css");
    </style>
    <script src="js/mainjs.js"></script>
</head>
<body>

    <div class="container">
        <table>
            <tr>
                <td>
                    <button type="button" onclick="addNode()">Add Node</button>
                </td>
                <td>Content</td>
                <td>
                    <input type="text" id="txtContent" class="input-content">
                </td>
                <td>Position</td>
                <td>
                    <input type="text" id="txtPositionAdd" class="input-position">
                </td>
            </tr>
            <tr>
                <td>
                    <button type="button" onclick="removeNode()">Remove Node</button>
                </td>
                <td></td>
                <td></td>
                <td>Position</td>
                <td>
                    <input type="text" id="txtPositionRemove" class="input-position">
                </td>
            </tr>
            <tr>
                <td>
                    <button type="button" onclick="modifyNode()">Modify Node</button>
                </td>
                <td>New Content</td>
                <td>
                    <input type="text" id="txtNewContent" class="input-content">
                </td>
                <td>Position</td>
                <td>
                    <input type="text" id="txtPositionModify" class="input-position">
                </td>
            </tr>
        </table>
        
        <div class="web-node-title">Web Node</div>
        <ul id="webList">
            <li>Data base</li>
            <li>Web1</li>
            <li>Web2</li>
        </ul>
    </div>

</body>
</html>
