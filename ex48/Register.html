<html>
    <head>
        <title>Tiêu đề trang</title>
    </head>
    <body style="background-color:rgb(166, 209, 255)">
        <form>
        <div style="text-align: center"><img src="images/Jackson.gif"></div>
        <h1 style="text-align:center">Registration Form</h1>
        <h4 style="text-align:center">Register your Jackson Electronics product here</h4>
        <table style="margin: auto;">
                <tr>
                    <td>
                        First Name:
                    </td>
                    <td>
                        <input type="text" name="first_name">
                    </td>
                    <td>
                        Last Name:
                    </td>
                    <td colspan="3">
                        <input type="text" name="last_name">
                    </td>
                </tr>
                <tr>
                    <td>
                        Address #1:
                    </td>
                    <td colspan="3">
                        <input type="text" name="address">
                    </td>
                </tr>
                <tr>
                    <td>
                        Address #2:
                    </td>
                    <td colspan="3">
                        <input type="text" name="address2">
                    </td>
                </tr>
                <tr>
                    <td>
                        City:
                    </td>
                    <td>
                        <input type="text" name="city">
                    </td>
                    <td>
                        State:
                    </td>
                    <td>
                        <input type="text" name="state">
                    </td>
                    <td>
                        Zip Code:
                    </td>
                    <td>
                        <input type="text" name="zip_code">
                    </td>
                </tr>
                <tr>
                    <td>
                        Country:
                    </td>
                    <td>
                        <input type="text" name="country" value="United States">
                    </td>
                </tr>
                <tr>
                    <td colspan="6"><hr style="border: 1px solid black; width: 100%;"></td>
                </tr>
        </table>
        <table style="margin: auto;">
            <tr> 
                <td>Product</td>
                <td colspan="2">
                    <select name="product">
                        <option value="tv">Scan Master</option>
                        <option value="stereo">Stereo</option>
                        <option value="laptop">Laptop</option>
                        <option value="phone">Phone</option>
                    </select>
                </td>
            </tr>
            <tr> 
                <td>Date Purchased</td>
                <td><input type="date" name="purchase_date"></td>
            </tr>
            <tr> 
                <td>Serial #</td>
                <td><input type="text" name="serial_number"></td>
            </tr>
            <tr>
                <td> Used for</td>
                <td><label><input type="radio" name="used_for" value="home"> Home</label></td>
                <td><label><input type="radio" name="used_for" value="education"> Education Institution</label></td>
            </tr>
            <tr>
                <td></td>
                <td><label><input type="radio" name="used_for" value="business"> Business</label></td>
                <td><label><input type="radio" name="used_for" value="other"> Other</label></td>
            </tr>
            <tr>
                <td>System (check all that apply)</td>
                <td><label><input type="checkbox" name="system" value="windows"> Windows</label></td>
                <td><label><input type="checkbox" name="system" value="unix"> Unix</label></td>
            </tr>
            <tr>
                <td></td>
                <td><label><input type="checkbox" name="system" value="mac"> Macintosh</label></td>
                <td><label><input type="checkbox" name="system" value="other"> Other</label></td>
            </tr>
            <tr>
                <td colspan="3"><hr style="border: 1px solid black; width: 100%;"></td>
            </tr>
        </table>
        <table style="margin: auto;">
            <tr>
                <td colspan="3"> Comment? </td>
                <td colspan="3">
                    <textarea name="comment" rows="5" cols="40"></textarea>
                </td>
            </tr>
            <tr>
                <td colspan="6" style="text-align: center;">
                    <input type="submit" value="Click to register">
                    <input type="reset" value="Click to Cancel">
                </td>
            </tr>
        </table>
        </form>
    </body>
</html>
