<html>
    <head> 
        <meta charset="UTF-8">
        <title> Tiêu đề trang </title>
        <script>
            function findsolution() {
                var a = parseFloat(myform.a.value);
                var b = parseFloat(myform.b.value);
                var c = parseFloat(myform.c.value);
                var delta = b * b - 4 * a * c;
                if (delta < 0) {
                    myform.result.value = "No solution";
                } else if (delta === 0) {
                    myform.result.value = "x = " + (-b / (2 * a));
                } else {
                    var x1 = (-b + Math.sqrt(delta)) / (2 * a);
                    var x2 = (-b - Math.sqrt(delta)) / (2 * a);
                    myform.result.value = "x1 = " + x1 + ", x2 = " + x2;
                }
            }
        </script>
    </head>
    <body>
        <form name="myform">
        <table>
            <tr>
                <td>a:</td>
                <td> <input type="text" name="a" value=""></td>
            </tr>
            <tr>
                <td>b:</td>
                <td> <input type="text" name="b" value=""></td>
            </tr>
            <tr>
                <td>c:</td>
                <td> <input type="text" name="c" value=""></td>
            </tr>
            <tr>
                <td>Result:</td>
                <td> <input type="text" name="result" value="" readonly></td>
            </tr>
            <tr>
                <td colspan="2">
                    <button type="button" onclick="findsolution()">Find Solution</button>
                    <button type="reset">Clear</button>
                </td>
            </tr>
        </table>
        </form>
    </body>
</html>
