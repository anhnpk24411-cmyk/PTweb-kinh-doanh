<html>
    <head>
        <meta charset="UTF-8">
        <title>Travel Expense Report</title>
    </head>
    <body style="background-color:rgb(166, 209, 255); margin:0; padding:20px;">
        <div style="text-align:center; margin-bottom:10px;">
            <img src="DeLong.jpg" alt="DeLong Enterprises" style="max-width:500px; width:100%; height:auto; display:block; margin:0 auto;">
        </div>
        <h1>Travel Expense Report</h1>
        <hr style="width:100%; border-color:#999;">
        <form style="width:90%; max-width:900px; margin:0 auto;">
            <table>
                <tr>
                    <td style="padding:5px 10px; vertical-align:top; width:170px;">1) First Name:</td>
                    <td style="padding:5px 10px;"><input type="text" name="firstName"></td>
                    <td style="padding:5px 10px; vertical-align:top; width:140px;">Last Name:</td>
                    <td style="padding:5px 10px;"><input type="text" name="lastName"></td>
                </tr>
                <tr>
                    <td style="padding:5px 10px; vertical-align:top;">2) Social Security Number:</td>
                    <td style="padding:5px 10px;"><input type="text" name="ssn"></td>
                    <td colspan="2"></td>
                </tr>
                <tr>
                    <td style="padding:5px 10px; vertical-align:top;">3) Department:</td>
                    <td style="padding:5px 10px;"><select name="department">
                        <option value="accounting">Accounting</option>
                        <option value="marketing">Marketing</option>
                        <option value="engineering">Engineering</option>
                        <option value="hr">Human Resource</option>
                    </select>
                    </td>
                    <td colspan="2"></td>
                </tr>
                <tr>
                    <td style="padding:5px 10px; vertical-align:top;">4) Describe the purpose of your trip:</td>
                    <td colspan="3" style="padding:5px 10px;"><textarea name="purpose" rows="4" style="width:100%;"></textarea></td>
                </tr>
                <tr>
                    <td colspan="4" style="padding:10px 10px 5px;"><strong>5) Itemize your travel expenses</strong></td>
                </tr>
                <tr>
                    <td colspan="4" style="padding:0 10px 10px;">
                        <table style="width:100%; border-collapse:collapse; border:1px solid #777;">
                            <thead>
                                <tr style="background:#d0f0ff;">
                                    <th style="border:1px solid #777; padding:6px;">Date</th>
                                    <th style="border:1px solid #777; padding:6px;">Description</th>
                                    <th style="border:1px solid #777; padding:6px;">Category</th>
                                    <th style="border:1px solid #777; padding:6px;">Amount</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td style="border:1px solid #777; padding:6px;"><input type="date" name="date1" style="width:100%;"></td>
                                    <td style="border:1px solid #777; padding:6px;"><input type="text" name="description1" style="width:100%;"></td>
                                    <td style="border:1px solid #777; padding:6px;"><select name="category1" style="width:100%;">
                                        <option value="meal">Meal</option>
                                        <option value="service">Service</option>
                                        <option value="transportation">Transportation</option>
                                        <option value="lodging">Lodging</option>
                                    </select></td>
                                    <td style="border:1px solid #777; padding:6px;"><input type="text" name="amount1" style="width:100%;"></td>
                                </tr>
                                <tr>
                                    <td style="border:1px solid #777; padding:6px;"><input type="date" name="date2" style="width:100%;"></td>
                                    <td style="border:1px solid #777; padding:6px;"><input type="text" name="description2" style="width:100%;"></td>
                                    <td style="border:1px solid #777; padding:6px;"><select name="category2" style="width:100%;">
                                        <option value="meal">Meal</option>
                                        <option value="service">Service</option>
                                        <option value="transportation">Transportation</option>
                                        <option value="lodging">Lodging</option>
                                    </select></td>
                                    <td style="border:1px solid #777; padding:6px;"><input type="text" name="amount2" style="width:100%;"></td>
                                </tr>
                                <tr>
                                    <td style="border:1px solid #777; padding:6px;"><input type="date" name="date3" style="width:100%;"></td>
                                    <td style="border:1px solid #777; padding:6px;"><input type="text" name="description3" style="width:100%;"></td>
                                    <td style="border:1px solid #777; padding:6px;"><select name="category3" style="width:100%;">
                                        <option value="meal">Meal</option>
                                        <option value="service">Service</option>
                                        <option value="transportation">Transportation</option>
                                        <option value="lodging">Lodging</option>
                                    </select></td>
                                    <td style="border:1px solid #777; padding:6px;"><input type="text" name="amount3" style="width:100%;"></td>
                                </tr>
                                <tr>
                                    <td style="border:1px solid #777; padding:6px;"><input type="date" name="date4" style="width:100%;"></td>
                                    <td style="border:1px solid #777; padding:6px;"><input type="text" name="description4" style="width:100%;"></td>
                                    <td style="border:1px solid #777; padding:6px;"><select name="category4" style="width:100%;">
                                        <option value="meal">Meal</option>
                                        <option value="service">Service</option>
                                        <option value="transportation">Transportation</option>
                                        <option value="lodging">Lodging</option>
                                    </select></td>
                                    <td style="border:1px solid #777; padding:6px;"><input type="text" name="amount4" style="width:100%;"></td>
                                </tr>
                            </tbody>
                        </table>
                    </td>
                </tr>
                <tr>
                    <td colspan="4" style="padding:10px 10px 5px;">6) Have you submitted your receipts?</td>
                </tr>
                <tr>
                    <td colspan="4" style="padding:5px 10px 20px;">
                        <label style="margin-right:15px;"><input type="radio" name="receipts" value="yes"> Yes</label>
                        <label><input type="radio" name="receipts" value="no"> No</label>
                    </td>
                </tr>
                <tr>
                    <td colspan="4" style="padding:5px 10px 20px; text-align:left;">
                        <input type="submit" value="Submit travel expenses" style="margin-right:10px; padding:6px 12px;">
                        <input type="reset" value="Reset" style="padding:6px 12px;">
                    </td>
                </tr>
                <tr>
                    <td colspan="4" style="padding:0 10px; font-size:13px; color:#333;">Questions? Contact Debbie Larson in Accounting (ext. 2150).</td>
                </tr>
            </table>
        </form>
    </body>
</html>
